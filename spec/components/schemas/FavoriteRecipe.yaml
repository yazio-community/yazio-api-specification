description: >-
  A favorited recipe with the portion count the user favorited it at. Used both
  as the request body of PUT /v22/user/favorites/recipes and as the item shape
  of GET /v22/user/favorites/recipe.
type: object
properties:
  id:
    type: string
  recipe_id:
    type: string
  portion_count:
    type: number
  yazio_id:
    type: string
    nullable: true
    readOnly: true
    description: >-
      Present on GET /v22/user/favorites/recipe for YAZIO recipes; not sent
      when favoriting. Null for user-created recipes.
