get:
  tags:
  - Body Values
  operationId: getLatestWeight
  summary: The most recent weight entry on or before a date
  responses:
    '200':
      description: ''
      content:
        application/json:
          schema:
            $ref: ../../../../../components/schemas/WeightEntry.yaml
  parameters:
    # Mandatory: a blank date answers 400. "last" means the latest entry on
    # or before this day.
  - name: date
    in: query
    required: true
    schema:
      type: string
