get:
  tags:
  - Diary
  operationId: listConsumedItems
  summary: Everything logged for a day
  responses:
    '200':
      description: ''
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/ConsumedItems.yaml
  parameters:
  - name: date
    in: query
    required: false
    schema:
      type: string
post:
  tags:
  - Diary
  operationId: addConsumedItems
  summary: Log products, recipe portions or simple entries
  responses:
    '204':
      description: Written
      content: {}
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/ConsumedItems.yaml
# Never captured; confirmed against the live API.
delete:
  tags:
  - Diary
  operationId: deleteConsumedItem
  summary: Remove one logged entry
  responses:
    '204':
      description: Removed
      content: {}
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/ConsumedItemsDeletion.yaml
