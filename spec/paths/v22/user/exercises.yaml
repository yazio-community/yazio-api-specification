get:
  tags:
  - Activity
  operationId: listExercises
  summary: List logged exercises for a day
  responses:
    '200':
      description: ''
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/ExerciseLog.yaml
  parameters:
  - name: date
    in: query
    required: false
    schema:
      type: string
post:
  tags:
  - Activity
  operationId: logExercise
  summary: Log an exercise
  responses:
    '200':
      description: OK
      content: {}
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/ExerciseEntry.yaml
