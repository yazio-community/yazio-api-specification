get:
  tags:
  - Products
  operationId: listSuggestedProducts
  summary: Products suggested for a meal slot
  responses:
    '200':
      description: ''
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../../../../components/schemas/SuggestedProduct.yaml
  parameters:
  - name: daytime
    in: query
    required: false
    schema:
      type: string
  - name: date
    in: query
    required: false
    schema:
      type: string
