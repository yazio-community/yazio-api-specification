get:
  tags:
  - Diary
  operationId: getWaterIntake
  summary: Water logged for a day
  responses:
    '200':
      description: ''
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/WaterIntake.yaml
  parameters:
  - name: date
    in: query
    required: false
    schema:
      type: string
post:
  tags:
  - Diary
  operationId: setWaterIntake
  summary: Set the water logged for a day
  responses:
    '200':
      description: OK
      content: {}
  requestBody:
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: ../../../components/schemas/WaterIntakeEntry.yaml
